name: ai-agent-reusable

# Reusable pipeline for OTHER repositories in the EasyIndie organization.
# A caller repo adds a ~15-line workflow that calls this file with the issue
# number and the DeepSeek key (see scripts/install-to-repo.sh). All pipeline
# logic and the runner code stay centralized here (@main auto-updates callers).
#
# Prereqs on the EasyGithub repo settings:
#   Settings > Actions > General > Access = "Accessible from repositories in
#   the EasyIndie organization"  (already set)
on:
  workflow_call:
    inputs:
      issue-number:
        type: number
        required: true
      agent:
        type: string
        required: false
        default: ""
      model:
        type: string
        required: false
        default: ""
      thinking:
        type: string
        required: false
        default: ""
      max-attempts:
        type: number
        required: false
        default: 3
      verify-cmd:
        type: string
        required: false
        default: ""
    secrets:
      deepseek-api-key:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-agent-reusable-${{ inputs.issue-number }}
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ inputs.issue-number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      RUNNER_TEMP: ${{ runner.temp }}
      AGENT: ${{ inputs.agent }}
      MODEL: ${{ inputs.model }}
      THINKING: ${{ inputs.thinking }}
      AI_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
      VERIFY_CMD: ${{ inputs.verify-cmd }}
      DEEPSEEK_API_KEY: ${{ secrets.deepseek-api-key }}
      # Claude Code agent -> DeepSeek (Anthropic-compatible endpoint)
      ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.deepseek-api-key }}
      ANTHROPIC_MODEL: "deepseek-v4-pro[1m]"
      ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro[1m]"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
      CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
      CLAUDE_CODE_EFFORT_LEVEL: max
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "786432"
    steps:
      - name: Skip already-handled issues
        run: |
          LABELS=$(gh issue view "${{ inputs.issue-number }}" -R "${{ github.repository }}" --json labels -q '[.labels[].name]')
          for x in ai-running ai-pr ai-failed ai-done; do
            if echo "$LABELS" | grep -q "\"$x\""; then
              echo "issue already handled ($x); skipping."
              exit 0
            fi
          done
          echo "issue is fresh; proceeding."

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run agent runner (composite action from EasyGithub)
        uses: EasyIndie/EasyGithub/.github/actions/agent-runner@main

      - name: Upload run logs (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-issue-${{ inputs.issue-number }}-logs
          path: ${{ runner.temp }}/ai-issue-${{ inputs.issue-number }}
          if-no-files-found: ignore
          retention-days: 7
