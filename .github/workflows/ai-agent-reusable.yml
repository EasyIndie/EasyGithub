name: ai-agent-reusable

# Reusable pipeline for OTHER repositories in the EasyIndie organization.
# A caller repo adds a ~15-line workflow that calls this file with the issue
# number and the DeepSeek key (see scripts/install-to-repo.sh). All pipeline
# logic and the runner code stay centralized here (@main auto-updates callers).
#
# Prereqs on the EasyGithub repo settings:
#   Settings > Actions > General > Access = "Accessible from repositories in
#   the EasyIndie organization"  (already set)
on:
  workflow_call:
    inputs:
      issue_number:
        type: number
        required: true
      agent:
        type: string
        required: false
        default: ""
      model:
        type: string
        required: false
        default: ""
      thinking:
        type: string
        required: false
        default: ""
      max_attempts:
        type: number
        required: false
        default: 3
      verify_cmd:
        type: string
        required: false
        default: ""
    secrets:
      deepseek_api_key:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Export pipeline env
        env:
          ISSUE: ${{ inputs.issue_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ inputs.model }}
          THINKING: ${{ inputs.thinking }}
          ATTEMPTS: ${{ inputs.max_attempts }}
          VERIFY: ${{ inputs.verify_cmd }}
          DEEPSEEK: ${{ secrets.deepseek_api_key }}
        run: |
          {
            echo "GH_TOKEN=${{ github.token }}"
            echo "ISSUE_NUMBER=$ISSUE"
            echo "DEFAULT_BRANCH=$DEFAULT_BRANCH"
            echo "RUNNER_TEMP=$RUNNER_TEMP_DIR"
            echo "AGENT=$AGENT"
            echo "MODEL=$MODEL"
            echo "THINKING=$THINKING"
            echo "AI_MAX_ATTEMPTS=$ATTEMPTS"
            echo "VERIFY_CMD=$VERIFY"
            echo "DEEPSEEK_API_KEY=$DEEPSEEK"
            echo "ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic"
            echo "ANTHROPIC_AUTH_TOKEN=$DEEPSEEK"
            echo "ANTHROPIC_MODEL=deepseek-v4-pro[1m]"
            echo "ANTHROPIC_DEFAULT_OPUS_MODEL=deepseek-v4-pro[1m]"
            echo "ANTHROPIC_DEFAULT_SONNET_MODEL=deepseek-v4-pro[1m]"
            echo "ANTHROPIC_DEFAULT_HAIKU_MODEL=deepseek-v4-flash"
            echo "CLAUDE_CODE_SUBAGENT_MODEL=deepseek-v4-flash"
            echo "CLAUDE_CODE_EFFORT_LEVEL=max"
            echo "CLAUDE_CODE_AUTO_COMPACT_WINDOW=786432"
          } >> "$GITHUB_ENV"

      - name: Skip already-handled issues
        run: |
          LABELS=$(gh issue view "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --json labels -q '[.labels[].name]')
          for x in ai-running ai-pr ai-failed ai-done; do
            if echo "$LABELS" | grep -q "\"$x\""; then
              echo "issue already handled ($x); skipping."
              exit 0
            fi
          done
          echo "issue is fresh; proceeding."

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run agent runner (composite action from EasyGithub)
        uses: EasyIndie/EasyGithub/.github/actions/agent-runner@main

      - name: Upload run logs (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-issue-${{ inputs.issue_number }}-logs
          path: ${{ runner.temp }}/ai-issue-${{ inputs.issue_number }}
          if-no-files-found: ignore
          retention-days: 7
