name: ai-watch

# Post-merge watchdog for the hub repository itself (H4).
#
# The detection + incident/revert logic lives in `agent-runner/src/watch.ts`, the
# same module the dispatcher runs for zero-file targets — one implementation, so
# the two paths cannot drift (a squash-merge can drop the `[AI]` prefix, and the
# module falls back to the associated PR title).
#
# Scope: this repository only. Target repositories are covered by
# `ghapp-scan` -> dispatcher -> runWatchdog.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: ai-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Watch the default branch
        id: watch
        run: |
          set -euo pipefail
          node agent-runner/src/watch.ts --repo "$GITHUB_REPOSITORY" --max-age-days 7 | tee /tmp/watch.json
          ACTION=$(tail -n 1 /tmp/watch.json | jq -r '.action // "none"')
          echo "action=${ACTION}" >> "$GITHUB_OUTPUT"

      - name: Trip the auto-merge circuit breaker
        if: steps.watch.outputs.action == 'incident'
        env:
          GH_TOKEN: ${{ secrets.EASYGH_PR_TOKEN || github.token }}
        run: |
          if gh variable set AI_AUTOMERGE --body off 2>/dev/null; then
            echo "AI_AUTOMERGE=off"
          else
            echo "::warning::could not set AI_AUTOMERGE (needs admin token); the ai-incident latch still blocks auto-merge"
          fi
