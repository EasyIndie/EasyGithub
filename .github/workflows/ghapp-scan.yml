name: ghapp-scan

# GitHub-App (zero-file, non-invasive) cross-repo mode.
#
# Runs on a schedule in the hub repository. A GitHub App installation token
# (org-wide) lets the dispatcher read issues and write branches/PRs in ANY
# repository of the installation's org, without adding any workflow/runner file
# to those repos.
#
# Multiple organizations: `vars.EASYGH_ORGS` is a comma-separated list
# (e.g. "EasyIndie,OrzMC,OrzGeeker"). Each org gets its own matrix job and its
# own installation token, so one hub can serve several organizations without
# sharing per-org credentials (`vars.EASYGH_ORG` is still honoured as a
# single-org fallback).
#
# Trigger markers for an issue (union):
#   - label `ai`
#   - marker `easygh-ai` in the title or body, from an OWNER/MEMBER/COLLABORATOR author
# Poll cadence: EasyGithub is a PUBLIC repo, so Actions here are free/unmetered.
# */5 gives ~5-minute latency at zero quota cost. For real-time, see docs/realtime.md
# (event-driven via webhook is still needed for sub-minute response).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Dispatch ai-run.yml for repositories whose profile pins a runner.
  actions: write

concurrency:
  group: ghapp-scan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      orgs: ${{ steps.list.outputs.orgs }}
    steps:
      - name: Build the organization matrix
        id: list
        env:
          ORGS: ${{ vars.EASYGH_ORGS }}
          ORG: ${{ vars.EASYGH_ORG }}
        run: |
          set -euo pipefail
          RAW="${ORGS:-${ORG:-EasyIndie}}"
          JSON=$(printf '%s' "$RAW" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^$' | jq -R -s -c \
              'split("\n") | map(select(length > 0)) | unique
               | map({org: ., key: (ascii_upcase | gsub("[^A-Z0-9]"; "_"))})')
          echo "orgs=${JSON}" >> "$GITHUB_OUTPUT"
          echo "matrix: ${JSON}"

  scan:
    name: scan (${{ matrix.item.org }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # plan emits [{org: "OrzMC", key: "ORZMC"}, ...] so a per-org App
        # credential (EASYGH_APP_ID_ORZMC) can be looked up safely.
        item: ${{ fromJSON(needs.plan.outputs.orgs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Mint GitHub App installation token (${{ matrix.item.org }})
        id: mint
        # Tolerance for orgs that are configured but not installed yet: the job
        # stays green and says so, instead of failing every 5 minutes.
        continue-on-error: true
        env:
          # Per-org App credentials win over the shared app, so each org can own
          # its own App (needed when the shared App is private/"only this account").
          EASYGH_APP_ID: ${{ vars[format('EASYGH_APP_ID_{0}', matrix.item.key)] || vars.EASYGH_APP_ID }}
          EASYGH_APP_PRIVATE_KEY: ${{ secrets[format('EASYGH_APP_PRIVATE_KEY_{0}', matrix.item.key)] || secrets.EASYGH_APP_PRIVATE_KEY }}
          ORG: ${{ matrix.item.org }}
        run: node scripts/ghapp-token.mjs

      - name: Skip ${{ matrix.item.org }} (app not installed)
        if: steps.mint.outcome != 'success'
        run: echo "::notice title=ghapp-scan::organization ${{ matrix.item.org }} has no installation for the configured App; skipping"

      - name: Dispatch AI issues in ${{ matrix.item.org }}
        if: steps.mint.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          # Used only to dispatch ai-run.yml (the App token cannot dispatch hub workflows).
          GITHUB_TOKEN: ${{ github.token }}
          ORG: ${{ matrix.item.org }}
          REPO_FILTER: ${{ vars.EASYGH_REPO_FILTER }}
          MAX_ISSUES: ${{ vars.EASYGH_MAX_ISSUES || '4' }}
          # Wall-clock budget per scan (job timeout is 60 min) and per issue
          # (agent session + retries). Keeps a slow target from eating the queue.
          DISPATCH_BUDGET_MS: ${{ vars.EASYGH_DISPATCH_BUDGET_MS || '3000000' }}
          AGENT_BUDGET_MS: ${{ vars.EASYGH_AGENT_BUDGET_MS || '2400000' }}
          PI_TIMEOUT_MS: "900000"
          # Cross-repo post-merge watchdog (targets cannot host ai-watch themselves).
          EASYGH_WATCHDOG: ${{ vars.EASYGH_WATCHDOG || 'on' }}
          AI_AUTOMERGE: ${{ vars.AI_AUTOMERGE || 'off' }}
          # Prompt language / variant (profile locale and promptsDir still apply per repo).
          AI_LOCALE: ${{ vars.AI_LOCALE || '' }}
          EASYGH_PROMPTS_DIR: ${{ vars.EASYGH_PROMPTS_DIR || '' }}
          AI_MAX_PRS_PER_DAY: ${{ vars.AI_MAX_PRS_PER_DAY || '10' }}
          AI_REVIEWER: ${{ vars.AI_REVIEWER || '' }}
          # Per-repo verification for zero-file targets (JSON map, hub-side);
          # overrides the committed agent-runner/config/verify.json.
          # {"EasyIndie/EasyBot":"cargo test"}   (empty -> file/auto-detect)
          EASYGH_VERIFY_CMDS: ${{ vars.EASYGH_VERIFY_CMDS }}
          VERIFY_TIMEOUT_MS: ${{ vars.EASYGH_VERIFY_TIMEOUT_MS || '600000' }}
          RUNNER_TEMP: ${{ runner.temp }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Claude Code agent -> DeepSeek (Anthropic-compatible endpoint)
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
          CLAUDE_CODE_EFFORT_LEVEL: max
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "786432"
        run: node agent-runner/src/dispatcher.ts

      - name: Upload dispatch logs (${{ matrix.item.org }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ghapp-dispatch-${{ matrix.item.org }}
          path: ${{ runner.temp }}/ghapp-dispatch/**
          if-no-files-found: ignore
          retention-days: 7
