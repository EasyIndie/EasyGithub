name: zz-reusable8
on:
  workflow_call:
    inputs:
      issue_number:
        type: number
        required: true
    secrets:
      deepseek_api_key:
        required: true
jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - run: echo "zz8 ok issue=${{ inputs.issue_number }} perms=${{ github.token != '' }}"
