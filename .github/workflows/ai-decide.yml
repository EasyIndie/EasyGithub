name: ai-decide

# The human interface for the pipeline, for the hub and for zero-file targets.
#
# Everything the pipeline cannot decide alone is expressed as a workflow
# dispatch with an explicit, auditable action:
#   retry          re-arm a failed / blocked / deferred issue
#   cancel         abandon an in-flight run and drop its claim lock
#   answer         reply to a "needs input" question and re-run
#   waive          record a human exception (audit only, never bypasses policy)
#   set-automerge  switch AI_AUTOMERGE between off / probation / on
#
# Authorization is checked against the HUB repository (the control plane), then
# an installation token for the target repository's organization is minted, so
# a single hub can operate on EasyIndie / OrzMC / OrzGeeker issues. Every action
# leaves an `easygh-decision` comment on the target issue.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number"
        required: true
        type: string
      action:
        description: "Action"
        required: true
        type: choice
        options:
          - retry
          - cancel
          - answer
          - waive
          - set-automerge
      repo:
        description: "Target repository (owner/name); empty = this hub repository"
        required: false
        type: string
        default: ""
      note:
        description: "Answer / exception note (answer, waive)"
        required: false
        type: string
        default: ""
      mode:
        description: "AI_AUTOMERGE value (set-automerge)"
        required: false
        type: choice
        options:
          - off
          - probation
          - on
        default: off

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-decide-${{ inputs.repo }}-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUB: ${{ github.repository }}
      ISSUE: ${{ inputs.issue }}
      ACTION: ${{ inputs.action }}
      REPO_INPUT: ${{ inputs.repo }}
      NOTE: ${{ inputs.note }}
      MODE: ${{ inputs.mode }}
      ACTOR: ${{ github.actor }}
      PAT: ${{ secrets.EASYGH_PR_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve target repository
        id: target
        run: |
          set -euo pipefail
          case "$ISSUE" in
            ''|*[!0-9]*) echo "::error::issue must be a number"; exit 1 ;;
          esac
          TARGET="${REPO_INPUT:-$HUB}"
          case "$TARGET" in
            */*) ;;
            *) echo "::error::repo must be owner/name"; exit 1 ;;
          esac
          echo "repo=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "org=${TARGET%%/*}" >> "$GITHUB_OUTPUT"

      - name: Authorize actor (hub permissions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PERM=$(gh api "repos/${HUB}/collaborators/${ACTOR}/permission" --jq .permission 2>/dev/null || echo none)
          case "$PERM" in
            admin|maintain|write) echo "authorized (${PERM}) as ${ACTOR}" ;;
            *) echo "::error::${ACTOR} has no write access to ${HUB} (${PERM})"; exit 1 ;;
          esac

      - name: Mint token for the target organization
        env:
          EASYGH_APP_ID: ${{ vars.EASYGH_APP_ID }}
          EASYGH_APP_PRIVATE_KEY: ${{ secrets.EASYGH_APP_PRIVATE_KEY }}
          ORG: ${{ steps.target.outputs.org }}
        run: |
          set -euo pipefail
          if [ -n "${EASYGH_APP_ID:-}" ] && [ -n "${EASYGH_APP_PRIVATE_KEY:-}" ]; then
            node scripts/ghapp-token.mjs
          else
            echo "::warning::no App credentials; falling back to EASYGH_PR_TOKEN / GITHUB_TOKEN (hub only)"
            echo "GH_TOKEN=${PAT:-}" >> "$GITHUB_ENV"
          fi

      - name: Apply action
        env:
          TARGET: ${{ steps.target.outputs.repo }}
        run: |
          set -euo pipefail
          lock="repos/${TARGET}/git/refs/tags/ai-lock-issue-${ISSUE}"
          audit() {
            gh issue comment "$ISSUE" -R "$TARGET" \
              --body "<!-- easygh-decision actor=${ACTOR} action=${ACTION} -->"$'\n\n'"${1}"
          }
          rearm() {
            for label in ai-running ai-pr ai-failed ai-done ai-needs-input ai-deferred ai-stale; do
              gh issue edit "$ISSUE" -R "$TARGET" --remove-label "$label" >/dev/null 2>&1 || true
            done
            gh issue edit "$ISSUE" -R "$TARGET" --add-label ai
          }

          case "$ACTION" in
            retry)
              rearm
              audit "已按 ${ACTOR} 的请求重新排队（retry）。"
              ;;
            cancel)
              gh issue edit "$ISSUE" -R "$TARGET" --remove-label ai-running >/dev/null 2>&1 || true
              gh api -X DELETE "$lock" >/dev/null 2>&1 || true
              audit "已按 ${ACTOR} 的请求取消当前运行（cancel）。锁已释放。"
              ;;
            answer)
              [ -n "$NOTE" ] || { echo "::error::note is required for answer"; exit 1; }
              gh issue comment "$ISSUE" -R "$TARGET" --body "$NOTE"
              rearm
              audit "已把 ${ACTOR} 的回答交给流水线（answer → retry）。"
              ;;
            waive)
              [ -n "$NOTE" ] || { echo "::error::note is required for waive"; exit 1; }
              audit "人工决定（waive，由 ${ACTOR} 记录，不会绕过策略）：${NOTE}"
              ;;
            set-automerge)
              # Repo variables need admin; the App token cannot do this.
              if [ -z "${PAT:-}" ]; then
                echo "::error::set-automerge needs the EASYGH_PR_TOKEN secret (admin PAT)"
                exit 1
              fi
              GH_TOKEN="$PAT" gh variable set AI_AUTOMERGE --repo "$HUB" --body "$MODE"
              audit "AI_AUTOMERGE 已设为 \`${MODE}\`（由 ${ACTOR}，作用于 hub ${HUB}）。"
              ;;
            *)
              echo "::error::unknown action ${ACTION}"; exit 1 ;;
          esac
