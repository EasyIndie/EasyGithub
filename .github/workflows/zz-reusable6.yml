name: zz-reusable6
on:
  workflow_call:
    inputs:
      issue_number:
        type: number
        required: true
    secrets:
      deepseek_api_key:
        required: true
permissions:
  contents: write
  issues: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "zz6 ok issue=${{ inputs.issue_number }} secretNonEmpty=${{ secrets.deepseek_api_key != '' }}"
