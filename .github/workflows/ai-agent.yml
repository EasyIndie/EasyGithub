name: ai-agent

# Trigger: any Issue gets the `ai` label.
# The first step filters non-`ai` labels and already-handled issues, so this
# workflow is inert unless someone explicitly asks the AI to work.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-agent:
    if: github.event.label.name == 'ai'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip already-handled issues
        run: |
          LABELS=$(gh issue view "${{ github.event.issue.number }}" -R "${{ github.repository }}" --json labels -q '[.labels[].name]')
          for x in ai-running ai-pr ai-failed ai-done; do
            if echo "$LABELS" | grep -q "\"$x\""; then
              echo "issue already handled ($x); skipping."
              exit 0
            fi
          done
          echo "issue is fresh; proceeding."

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pi (pinned)
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
          pi --version

      - name: Run agent runner
        id: run
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUNNER_TEMP: ${{ runner.temp }}
          AGENT: ${{ vars.AI_AGENT || '' }}
          PROVIDER: deepseek
          MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-pro' }}
          THINKING: ${{ vars.AI_THINKING || '' }}
          PI_TIMEOUT_MS: "1500000"
          # V0.3: independent verification inside the ai-agent workflow
          # (avoids the approval gate GitHub applies to bot-created PRs).
          AI_MAX_ATTEMPTS: ${{ vars.AI_MAX_ATTEMPTS || '3' }}
          # optional: override the auto-detected check command
          # VERIFY_CMD: "npm run lint && npm test"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Claude Code agent -> DeepSeek (Anthropic-compatible endpoint)
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-flash
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
          CLAUDE_CODE_EFFORT_LEVEL: max
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "786432"
        run: node agent-runner/src/main.ts

      - name: Upload run logs (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-issue-${{ github.event.issue.number }}-logs
          path: ${{ runner.temp }}/ai-issue-${{ github.event.issue.number }}
          if-no-files-found: ignore
          retention-days: 7
