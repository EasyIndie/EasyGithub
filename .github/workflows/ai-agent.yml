name: ai-agent

# Trigger: any Issue gets the `ai` label.
# The first step filters non-`ai` labels and already-handled issues, so this
# workflow is inert unless someone explicitly asks the AI to work.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-agent:
    if: github.event.label.name == 'ai'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip already-handled issues
        run: |
          LABELS=$(gh issue view "${{ github.event.issue.number }}" -R "${{ github.repository }}" --json labels -q '[.labels[].name]')
          for x in ai-running ai-pr ai-failed ai-done; do
            if echo "$LABELS" | grep -q "\"$x\""; then
              echo "issue already handled ($x); skipping."
              exit 0
            fi
          done
          echo "issue is fresh; proceeding."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pi (pinned)
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
          pi --version

      - name: Run agent runner
        id: run
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUNNER_TEMP: ${{ runner.temp }}
          AGENT: pi
          PROVIDER: deepseek
          MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-pro' }}
          THINKING: ${{ vars.AI_THINKING || '' }}
          PI_TIMEOUT_MS: "1500000"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node agent-runner/src/main.ts

      - name: Upload run logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-issue-${{ github.event.issue.number }}-logs
          path: ${{ runner.temp }}/ai-issue-${{ github.event.issue.number }}
          if-no-files-found: ignore
          retention-days: 7
